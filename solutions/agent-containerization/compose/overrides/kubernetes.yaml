# Hand-authored Compose counterpart of profiles/kubernetes.yaml (R12.9, Feature
# 02.3 SF-5, Decision 2). Like compose/overrides/github.yaml, the kubernetes pack
# DOES declare a credential (Interface Contract 1's `kubeconfig`), so this carries
# the `secrets:` block Interface Contract 3 shapes. `scripts/check-profile-
# compose.sh --profile kubernetes` asserts the secret-set delta from `default`
# equals exactly {pack-kubernetes-kubeconfig} on every agent, and every other
# rendered field matches.
#
# mounts.project.path in profiles/default.yaml is a placeholder for the
# operator's own project directory -- see compose/overrides/terraform.yaml's
# comment for why this binds `../workspace`, never `..`.

x-limits: &limits
  cpus: "2.0"
  mem_limit: 4g
  pids_limit: 512

secrets:
  pack-kubernetes-kubeconfig:
    file: ${PACK_CREDENTIALS_DIR:-../compose/generated/credentials}/kubernetes/kubernetes/kubeconfig

services:
  egress-mediator:
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256

  claude:
    <<: *limits
    volumes:
      - ../workspace:/workspace:rw
    secrets:
      - pack-kubernetes-kubeconfig

  codex:
    <<: *limits
    volumes:
      - ../workspace:/workspace:rw
    secrets:
      - pack-kubernetes-kubeconfig

  agy:
    <<: *limits
    volumes:
      - ../workspace:/workspace:rw
    secrets:
      - pack-kubernetes-kubeconfig
