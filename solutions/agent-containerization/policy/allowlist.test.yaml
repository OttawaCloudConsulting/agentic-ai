# TEST-SCOPED allowlist (01.3 SF-8). Never loaded by a shipped profile.
#
# The harness asserts the three egress controls against destinations it OWNS, so it needs
# names that resolve to its own fixtures. Those names cannot go in
# `policy/allowlist.base.yaml`: that file is discovery-derived, carries `provisional: true`
# against `docs/records/agent-verification.md` (D17), and is the record of what the real
# agents were observed to reach. Fixture hostnames in it would corrupt that provenance.
#
# `scripts/compile-policy.sh --allowlist policy/allowlist.test.yaml` selects this instead, and
# the compiled artifact records which base it came from, so the test policy is as auditable as
# the shipped one.
#
# Every name is under `.test`, which RFC 6761 reserves for exactly this and which no real
# resolver will ever answer. The addresses live in `compose/overrides/test-egress.yaml`.
provisional: true
pins: agent-verification.md

agents:
  claude:
    # allowed.fixture.lab and denied.fixture.lab share ONE address (172.31.40.20). That pair
    # is the T6 assertion: per-connection L7 evaluation, not an IP snapshot -- the allowed name
    # succeeds and the denied one is refused although the destination address is identical.
    allow_fqdns:
      - {fqdn: allowed.fixture.lab, port: 443, upgrade: false}
      # Allowlisted for claude and for NO other agent. Phase B drives it from each network to
      # show the listener serves its own agent's policy rather than a union.
      - {fqdn: claude-only.fixture.lab, port: 443, upgrade: false}
      # Resolves to 172.31.40.21, which the test denylist denies as a /32. Allowlisted here on
      # purpose: deny must win over allow (R5.3, R5.7), and the neighbouring address .20 must
      # keep working -- that pair is what distinguishes a real single-address deny from a
      # mis-sized mask (criterion 10).
      - {fqdn: neighbour.fixture.lab, port: 443, upgrade: false}
      # Allowlisted so that the FQDN deny has something to overrule. R5.1's deny_fqdns is
      # evaluated AFTER the allowlist gate, so a name absent from the allowlist would be
      # refused by default-deny and a passing assertion would prove nothing about deny_fqdns.
      # It resolves to the same address as an allowed name, so the refusal cannot be an
      # address deny wearing an FQDN's name either.
      - {fqdn: denied-by-fqdn.fixture.lab, port: 443, upgrade: false}
      # SF-3 CDN-rotation scenario (Decision 5). Resolves to .20 at first, then the harness
      # sed-swaps the fixture resolver to answer .21 -- the criterion-10 /32 deny -- between
      # attempts. The allowlist entry itself never changes; only the resolved address does.
      - {fqdn: rotating.fixture.lab, port: 443, upgrade: false}
    allow_cidrs: []
  codex:
    allow_fqdns:
      - {fqdn: allowed.fixture.lab, port: 443, upgrade: false}
      # criterion 3's WebSocket path. Under peek+splice there is no flag to inspect, so it is
      # asserted behaviourally against an Upgrade-capable endpoint.
      - {fqdn: upgrade.fixture.lab, port: 443, upgrade: true}
      - {fqdn: neighbour.fixture.lab, port: 443, upgrade: false}
    allow_cidrs: []
  agy:
    allow_fqdns:
      - {fqdn: allowed.fixture.lab, port: 443, upgrade: false}
    allow_cidrs: []
