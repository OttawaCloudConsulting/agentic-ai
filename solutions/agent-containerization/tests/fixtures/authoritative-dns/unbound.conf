# Authoritative for everything, forwards nowhere. Any query reaching this server
# came from the mediator's resolver, which is what makes "no query arrived" a
# meaningful assertion rather than an absence of evidence.
server:
    verbosity: 1
    username: ""
    chroot: ""
    pidfile: ""
    directory: "/tmp"
    logfile: ""
    use-syslog: no
    log-queries: yes
    log-replies: yes
    log-time-ascii: yes
    do-daemonize: no
    interface: 0.0.0.0
    port: 53
    access-control: 0.0.0.0/0 allow

    # `static`: this server answers from local data and NXDOMAINs the rest. There is
    # no path from here to the internet, so a fixture that is reached cannot
    # accidentally resolve a real name and mask a policy failure.
    local-zone: "." static

    # The fixture hosts. These are the names policy/resolved/test-fixtures.yaml
    # allowlists, so T6's "the allowed domain succeeds" half has something to
    # succeed against without contacting any third party.
    local-data: "allowed.fixture.test. IN A 203.0.113.10"
    local-data: "allowed.fixture.test. IN AAAA 2001:db8::10"
    local-data: "denied.fixture.test. IN A 203.0.113.20"

    # Two names sharing ONE address, for the phase C assertion that evaluation is
    # per-connection at L7 rather than an IP snapshot: the allowed name succeeds and
    # the denied name is refused although both resolve here.
    local-data: "shared-allowed.fixture.test. IN A 203.0.113.30"
    local-data: "shared-denied.fixture.test. IN A 203.0.113.30"

    # Present so a subdomain that WOULD have been forwarded is answerable. If the
    # exact-match control ever regresses, the test sees a successful answer rather
    # than an ambiguous NXDOMAIN.
    local-data: "leak.allowed.fixture.test. IN A 203.0.113.99"
    local-data: "allowed.fixture.test. IN TXT \"t4-qtype-marker\""
