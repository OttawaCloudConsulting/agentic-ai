# The T4 fixture: a controlled authoritative server the harness OWNS (01.3 SF-8).
#
# T4 asserts an ABSENCE -- that a name encoding data in its labels produces no query at the
# authoritative server for the domain it targets. An absence cannot be asserted against a
# third-party resolver, so the harness runs its own, points the mediator's upstream at it, and
# reads its query log.
#
# Two properties matter and both are configuration, not commentary:
#   * it ANSWERS the fixture names locally -- `local-zone ... static` plus `local-data`
#   * it FORWARDS NOWHERE -- there is no `forward-zone:` in this file at all, and the root zone
#     is refused, so a name it does not hold is answered REFUSED rather than recursed. A fixture
#     that quietly recursed would turn a leak into a passing test.
# THE DOMAIN IS `.lab`, NOT `.test`, AND THAT IS A FINDING RATHER THAN A PREFERENCE.
# `.test` is RFC 6761 special-use, and `unbound` -- the mediator's re-originating stage --
# carries a built-in local zone for it: it answers such names ITSELF and never forwards them, so
# a fixture under `.test` is unreachable through the pod resolver no matter what the allowlist
# says. Measured at the SF-8 build by forwarding the same query for a `.test` and a `.lab` name
# through an isolated unbound: the `.lab` name resolved and the `.test` name was answered locally
# with no query leaving. The same trap applies to a real allowlist entry under `.test`,
# `.invalid`, `.localhost` or `.example`.
server:
  verbosity: 1
  interface: 0.0.0.0
  port: 53
  do-daemonize: no
  do-ip6: no
  chroot: ""
  username: ""
  directory: "/tmp"
  pidfile: ""
  use-syslog: no
  logfile: ""
  # THE assertion surface. Every arriving query is printed, so the harness can grep for a name
  # that must never have arrived.
  log-queries: yes
  access-control: 0.0.0.0/0 allow

  # Answer locally.
  local-zone: "fixture.lab." static
  # allowed and denied share ONE address: T6's per-connection L7 evaluation, which an IP
  # snapshot cannot express.
  local-data: "allowed.fixture.lab. IN A 172.31.40.20"
  local-data: "denied.fixture.lab. IN A 172.31.40.20"
  local-data: "denied-by-fqdn.fixture.lab. IN A 172.31.40.20"
  local-data: "claude-only.fixture.lab. IN A 172.31.40.20"
  # The neighbouring address of the /32 deny (criterion 10).
  local-data: "neighbour.fixture.lab. IN A 172.31.40.21"
  local-data: "upgrade.fixture.lab. IN A 172.31.40.30"

  # Everything else: refused, and recursion never attempted.
  local-zone: "." refuse
