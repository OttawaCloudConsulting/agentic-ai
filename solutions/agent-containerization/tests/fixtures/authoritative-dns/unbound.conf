# The T4 fixture: a controlled authoritative server the harness OWNS (01.3 SF-8).
#
# T4 asserts an ABSENCE -- that a name encoding data in its labels produces no query at the
# authoritative server for the domain it targets. An absence cannot be asserted against a
# third-party resolver, so the harness runs its own, points the mediator's upstream at it, and
# reads its query log.
#
# Two properties matter and both are configuration, not commentary:
#   * it ANSWERS the fixture names locally -- `local-zone ... static` plus `local-data`
#   * it FORWARDS NOWHERE -- there is no `forward-zone:` in this file at all, and the root zone
#     is refused, so a name it does not hold is answered REFUSED rather than recursed. A fixture
#     that quietly recursed would turn a leak into a passing test.
server:
  verbosity: 1
  interface: 0.0.0.0
  port: 53
  do-daemonize: no
  do-ip6: no
  chroot: ""
  username: ""
  directory: "/tmp"
  pidfile: ""
  use-syslog: no
  logfile: ""
  # THE assertion surface. Every arriving query is printed, so the harness can grep for a name
  # that must never have arrived.
  log-queries: yes
  access-control: 0.0.0.0/0 allow

  # Answer locally.
  local-zone: "fixture.test." static
  # allowed and denied share ONE address: T6's per-connection L7 evaluation, which an IP
  # snapshot cannot express.
  local-data: "allowed.fixture.test. IN A 172.31.40.20"
  local-data: "denied.fixture.test. IN A 172.31.40.20"
  local-data: "denied-by-fqdn.fixture.test. IN A 172.31.40.20"
  local-data: "claude-only.fixture.test. IN A 172.31.40.20"
  # The neighbouring address of the /32 deny (criterion 10).
  local-data: "neighbour.fixture.test. IN A 172.31.40.21"
  local-data: "upgrade.fixture.test. IN A 172.31.40.30"

  # Everything else: refused, and recursion never attempted.
  local-zone: "." refuse
